# libslang-vk CI — tests on lavapipe + per-toolchain library artifacts.
#
# Added CI gate to skip on .md-only commits (documentation-only changes)
# The check-only-md job examines changed files and skips CI if only .md files
# were modified, reducing CI resource usage for documentation updates.
#
# Lineage: this repo has had a ci.yml since the M0 scaffolding commit
# (workflow history: `25ce03d` M0 -> `f1bd2b8`/`aed9cef` M1 -> `b7c6583` M3).
# The 2026-10-18 extension added what it never had: artifact uploads — the
# per-toolchain distribution the plan prescribes (the C++23 API is
# same-toolchain ABI, include/slangvk/export.h). The merged workflow keeps
# the original's Release+Debug matrix and `vulkan-validationlayers` install
# (dropped by the first artifact upload pass — without that package the
# runner tests' validation gate is vacuous on CI) and preserves the original
# maintainer decision:
#
#   windows-msvc job dropped (maintainer decision 2026-10-17): the
#   VS-generator build is 5-8x slower than Ninja and the job hung on the
#   runner well past any plausible test runtime (all bounded core tests,
#   0 output). Windows remains covered by the mingw-w64 job below, which
#   builds static + shared and gates on the same suite.
#
#   linux           Release+Debug matrix, full ctest on lavapipe + Khronos
#                   validation layer (incl. synchronization validation, plan
#                   §10); Release also uploads libslangvk.a/.so + headers
#                   (commit-pinned ARTIFACTS.txt) and the shader_demo host
#                   binary (windowed GLFW build + bundled presets,
#                   artifact shader-demo-linux-x64)
#   linux-asan      address+undefined sanitized test build (examples off)
#   windows-mingw   MSYS2 MinGW-w64; uploads libslangvk.dll, libslangvk.dll.a
#                   (import) and libslangvk.a (static) + headers. The Vulkan
#                   runner tests skip cleanly with no ICD (documented in
#                   tests/CMakeLists.txt); every other test runs. Also
#                   uploads shader_demo.exe (windowed Win32 build + MinGW
#                   runtime DLLs + bundled presets,
#                   artifact shader-demo-windows-x64).
#   provenance      tools/scan_codefindings.py — the plan §4 clean-room gate
#                   (RetroArch fingerprint scan before every release; cheap
#                   enough to run on every push)
#
#   windows sanitized build: out of scope for v1 (maintainer decision
#   2026-10-18) — MinGW-w64 ASan support is experimental and the Linux
#   asan+ubsan job covers the whole suite; revisit only if a Windows-only
#   memory bug appears.
#
# The full-corpus compile-sweep ledger lives in corpus.yml (nightly, needs a
# slang-shaders checkout — too heavy for every push).

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Skip CI if the commit only contains .md files
jobs:
  check-only-md:
    name: Check for .md-only changes
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check if only .md files changed
        id: check
        run: |
          # Handle edge cases for git object references
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            # New branch - get files from the commit
            changed_files=$(git --no-pager diff --name-only --diff-filter=ACMRT HEAD^ HEAD 2>/dev/null || git diff --name-only --diff-filter=ACMRT /dev/null HEAD 2>/dev/null || echo "")
          elif [[ "${{ github.event.before }}" == "${{ github.sha }}" ]]; then
            # No changes detected
            changed_files=""
          else
            # Normal diff between commits
            changed_files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")
          fi
          
          # Debug output
          echo "Debug: github.event.before = ${{ github.event.before }}"
          echo "Debug: github.sha = ${{ github.sha }}"
          echo "Debug: changed_files = '$changed_files'"
          
          # Check if all changed files are .md files
          md_only=true
          if [[ -n "$changed_files" ]]; then
            echo "Analyzing $changed_files"
            for file in $changed_files; do
              echo "Checking file: $file"
              if [[ "$file" != *.md ]]; then
                echo "Non-.md file found: $file"
                md_only=false
                break
              fi
            done
          else
            echo "No changed files detected"
            md_only=false
          fi
          
          echo "should-skip=$md_only" >> $GITHUB_OUTPUT
          echo "Only .md files changed: $md_only"

  linux:
    name: linux-x64 (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    needs: check-only-md
    if: needs.check-only-md.outputs.should-skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + lavapipe + validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build mesa-vulkan-drivers vulkan-validationlayers libvulkan1
          # GLFW dev stack for the shader_demo windowed backend (auto-detected
          # in examples/CMakeLists.txt). Without these the demo silently
          # builds headless-only — fine for the test suite, but the Release
          # artifact should ship the real windowed binary. The Wayland
          # packages are best-effort; X11 alone satisfies the detection.
          sudo apt-get install -y --no-install-recommends libx11-dev libxrandr-dev libxinerama-dev libxext-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage shader_demo artifact
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p stage/shader-demo/presets
          cp build/examples/shader_demo stage/shader-demo/
          cp build/examples/corpus_sweep stage/shader-demo/
          cp build/examples/conformance stage/shader-demo/
          cp -r examples/presets/. stage/shader-demo/presets/
          cp examples/shader_demo/assets/testcard.png stage/shader-demo/
          # golden-image conformance kit: manifest + goldens + budgets + the
          # fixture preset trees the manifest references.
          cp -r tests/golden stage/shader-demo/tests-golden
          cp -r tests/data stage/shader-demo/tests-data
          cat > stage/shader-demo/USAGE.txt <<EOF
          shader_demo — CI artifact (linux-x64, windowed GLFW build)
          commit:    ${GITHUB_SHA}
          ref:       ${GITHUB_REF_NAME}
          toolchain: runner GCC, CMake + Ninja (Release)

          shader_demo    host demo binary (statically linked with
                         libslangvk + glslang; no install needed)
          presets/       self-contained demo presets (start here)
          testcard.png   480x320 default input image (auto-found next
                         to the exe; --input pattern for the animated one)

          Usage:
            ./shader_demo --list presets
            ./shader_demo --no-menu --frames 10 --out dump presets
            ./shader_demo presets                windowed + TUI menu
                                                 (starts on testcard.png)
            ./shader_demo --input pattern presets

          Windowed mode needs a Vulkan ICD with swapchain support (X11 or
          Wayland); on a headless server it falls back to PNG dumps
          automatically, or force it with --headless. Point the positional
          argument at any preset directory (e.g. a slang-shaders checkout).
          Controls: 1-9 switch preset, n/p next/prev, r reload preset from
          disk, i input source, l list, params (live values) /
          set NAME VALUE, q quit. Preset/shader file edits need reload
          (or a restart) - presets are cached per session.

          corpus_sweep         full-corpus load sweep + ledger tool (see
                               corpus/baseline-ledger.txt and the corpus
                               workflow). Pass .slangp roots; use an
                               ABSOLUTE root path. Example:
            ./corpus_sweep /abs/path/slang-shaders --ledger new.txt --baseline old.txt

          conformance          golden-image + perf-budget suite. The bundle
                               ships the kit (tests-golden/: manifest, goldens,
                               budgets) and the fixture presets (tests-data/):
            ./conformance golden --manifest tests-golden/manifest.txt \\
                --golden-dir tests-golden tests-data .
            ./conformance perf tests-data . --budgets tests-golden/budgets-lavapipe.txt
            ./conformance drill --manifest tests-golden/drill/manifest.txt \\
                tests-golden tests-data
          Goldens were generated on a lavapipe CPU renderer; on a real GPU
          expect drift — regenerate in place with --update. The drill is
          the fallback regression: every listed preset must be rejected
          cleanly with the device unharmed (CHECKLIST miss #11).
          EOF
          (cd stage && zip -qr ../shader-demo-linux-x64.zip shader-demo)

      - name: Upload shader_demo artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: shader-demo-linux-x64
          path: shader-demo-linux-x64.zip
          if-no-files-found: error

      - name: Stage artifacts
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p stage/libslangvk/include
          cp -r include/slangvk stage/libslangvk/include/
          cp build/libslangvk.a build/libslangvk.so stage/libslangvk/
          cp LICENSE stage/libslangvk/
          cat > stage/libslangvk/ARTIFACTS.txt <<EOF
          libslang-vk — CI artifacts (linux-x64)
          commit: ${GITHUB_SHA}
          ref:    ${GITHUB_REF_NAME}
          toolchain: runner GCC, CMake + Ninja (Release)

          libslangvk.a     static library
          libslangvk.so    shared library (glslang + volk linked in statically)
          include/slangvk/ public headers

          Notes:
          - C++23 API: same-toolchain ABI only; prefer building via
            FetchContent (README) when your toolchain differs.
          - The static lib does not embed glslang; consumers add
            glslang::glslang + glslang::SPIRV (cmake/deps.cmake pins it).
          - MIT (LICENSE); third-party components keep their own licenses
            (PROVENANCE.md).
          EOF
          (cd stage && zip -qr ../libslangvk-linux-x64.zip libslangvk)

      - name: Upload artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: libslangvk-linux-x64
          path: libslangvk-linux-x64.zip
          if-no-files-found: error

  linux-asan:
    name: linux-x64 (asan+ubsan test build)
    runs-on: ubuntu-latest
    needs: check-only-md
    if: needs.check-only-md.outputs.should-skip != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + lavapipe + validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build mesa-vulkan-drivers vulkan-validationlayers libvulkan1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSLANGVK_SANITIZE=address,undefined -DSLANGVK_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          # The system Vulkan loader/driver sits outside the sanitized build;
          # LeakSanitizer trips on its allocations. Keep the live validation
          # gate and sanitizer aborts, drop leak reporting here.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  windows-mingw:
    name: win64-mingw (dll/a artifacts)
    runs-on: windows-latest
    needs: check-only-md
    if: needs.check-only-md.outputs.should-skip != 'true'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # python: glslang's build_info.h generation needs an interpreter
          # (everything else is fetched from source: no Vulkan SDK, no extra
          # env vars; -fno-rtti applies via the NOT-MSVC branch; export
          # macros key off _WIN32, so the shared variant gets
          # dllexport/dllimport on mingw too)
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            python:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        # No ICD on the runner, so the headless Vulkan tests skip themselves;
        # core suite + examples still gate.
        run: ctest --test-dir build --output-on-failure

      - name: Stage shader_demo artifact
        run: |
          mkdir -p stage/shader-demo/presets
          cp build/examples/shader_demo.exe stage/shader-demo/
          cp build/examples/corpus_sweep.exe stage/shader-demo/
          cp build/examples/conformance.exe stage/shader-demo/
          # MinGW runtime DLLs the exe needs on machines without MSYS2.
          cp /mingw64/bin/libstdc++-6.dll /mingw64/bin/libgcc_s_seh-1.dll \
             /mingw64/bin/libwinpthread-1.dll stage/shader-demo/
          cp -r examples/presets/. stage/shader-demo/presets/
          cp examples/shader_demo/assets/testcard.png stage/shader-demo/
          # golden-image conformance kit (see conformance.exe in USAGE.txt).
          cp -r tests/golden stage/shader-demo/tests-golden
          cp -r tests/data stage/shader-demo/tests-data
          cat > stage/shader-demo/USAGE.txt <<EOF
          shader_demo — CI artifact (windows-x64, MinGW-w64, windowed Win32)
          commit:    ${GITHUB_SHA}
          ref:       ${GITHUB_REF_NAME}
          toolchain: MSYS2 mingw-w64 GCC (CMake + Ninja, Release)

          shader_demo.exe     host demo binary (statically linked with
                              libslangvk + glslang)
          libstdc++-6.dll     MinGW runtime — keep next to the exe
          libgcc_s_seh-1.dll
          libwinpthread-1.dll
          presets/            self-contained demo presets (start here)
          testcard.png        480x320 default input image (auto-found next
                              to the exe; --input pattern for the animated one)

          Usage (from a terminal in this folder):
            shader_demo.exe --list presets
            shader_demo.exe --no-menu --frames 10 --out dump presets
            shader_demo.exe presets              windowed + TUI menu
                                                 (starts on testcard.png)
            shader_demo.exe --input pattern presets

          Windowed mode needs a Vulkan ICD with swapchain support; falls
          back to PNG dumps when none is found, or force it with
          --headless. Point the positional argument at any preset
          directory (e.g. a slang-shaders checkout).
          Controls: 1-9 switch preset, n/p next/prev, r reload preset from
          disk, i input source, l list, params (live values) /
          set NAME VALUE, q quit. Preset/shader file edits need reload
          (or a restart) - presets are cached per session.

          corpus_sweep.exe     full-corpus load sweep + ledger tool (see
                               corpus/baseline-ledger.txt and the corpus
                               workflow). Pass .slangp roots; use an
                               ABSOLUTE root path. Example:
            .\corpus_sweep.exe F:\abs\path\slang-shaders --ledger new.txt --baseline old.txt

          conformance.exe      golden-image + perf-budget suite. The bundle
                               ships the kit (tests-golden\: manifest, goldens,
                               budgets) and the fixture presets (tests-data\):
            conformance.exe golden --manifest tests-golden/manifest.txt --golden-dir tests-golden tests-data .
            conformance.exe perf tests-data . --budgets tests-golden/budgets-lavapipe.txt
            conformance.exe drill --manifest tests-golden/drill/manifest.txt tests-golden tests-data
          Goldens were generated on a lavapipe CPU renderer; on a real GPU
          expect drift — regenerate in place with --update. The drill is
          the fallback regression: every listed preset must be rejected
          cleanly with the device unharmed (CHECKLIST miss #11).
          EOF

      - name: Zip shader_demo
        shell: pwsh
        run: 7z a -tzip shader-demo-win64-mingw.zip ./stage/shader-demo

      - name: Upload shader_demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: shader-demo-windows-x64
          path: shader-demo-win64-mingw.zip
          if-no-files-found: error

      - name: Stage artifacts
        run: |
          mkdir -p stage/libslangvk/include
          cp -r include/slangvk stage/libslangvk/include/
          cp build/libslangvk.dll build/libslangvk.dll.a build/libslangvk.a stage/libslangvk/
          cp LICENSE stage/libslangvk/
          cat > stage/libslangvk/ARTIFACTS.txt <<EOF
          libslang-vk — CI artifacts (windows-x64, MinGW-w64)
          commit: ${GITHUB_SHA}
          ref:    ${GITHUB_REF_NAME}
          toolchain: MSYS2 mingw-w64 GCC (CMake + Ninja, Release)

          libslangvk.dll      shared build (SLANGVK_SHARED; glslang + volk
                              linked in statically)
          libslangvk.dll.a    MinGW import library for the DLL
          libslangvk.a        static library
          include/slangvk/    public headers

          Notes:
          - C++23 API: same-toolchain ABI only — link the DLL from
            MinGW-w64 GCC (matching major), not from MSVC.
          - The static lib does not embed glslang; consumers add
            glslang::glslang + glslang::SPIRV (cmake/deps.cmake pins it).
          - MIT (LICENSE); third-party components keep their own licenses
            (PROVENANCE.md).
          EOF

      - name: Zip
        shell: pwsh
        run: 7z a -tzip libslangvk-win64-mingw.zip ./stage/libslangvk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libslangvk-windows-x64-mingw
          path: libslangvk-win64-mingw.zip
          if-no-files-found: error

  provenance:
    name: provenance (clean-room gate)
    runs-on: ubuntu-latest
    needs: check-only-md
    if: needs.check-only-md.outputs.should-skip != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Scan for RetroArch code fingerprints
        # Plan §4 / risk 1: the release gate must pass before any tag; it runs
        # here on every push so a violation surfaces immediately, not at tag
        # time. exit 1 = finding(s); inline `provenance-ok:` waivers allowed.
        run: python3 tools/scan_codefindings.py --root .
